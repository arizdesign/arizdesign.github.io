</body>

<script>
function updateViewport() {
    const width = window.innerWidth;

    document.getElementById('viewport').textContent =
        width + 'px viewport';

    let opacity;

    if (width >= 1080) {

        // Lock at 0.8
        opacity = 0.7;

    } else if (width > 480) {

        // 1080 -> 480
        opacity = 0.1 + ((width - 480) / (1080 - 480)) * 0.7;

    } else {

        // 480 -> 0
        opacity = 0.1 + (width / 480) * 0.7;

    }

    opacity = Math.max(0.1, Math.min(0.8, opacity));

    document.querySelector('main').style.backgroundColor =
        `rgba(0,0,0,${opacity.toFixed(3)})`;
}

window.addEventListener('resize', updateViewport);
updateViewport();
</script>
