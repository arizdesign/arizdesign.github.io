<title>Emmanuel Arizmendi - Interactive Designer</title>

<style>
:root { -webkit-transition-duration: 0.2s; -moz-transition-duration: 0.2s; transition-duration: 0.2s; }

body {
    margin: 0;
    background: purple;
}

main {
    width: 100vw;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    color: white;
    font-size: 32px;
    letter-spacing: 2px;
}

</style>

</head>


<body>
<main id="viewport"></main>
</body>

<script>
function updateViewport() {
    const width = window.innerWidth;

    document.getElementById('viewport').textContent =
        width + 'px viewport';

    const opacity = Math.max(
        0.1,
        Math.min(
            0.8,
            0.1 + ((width - 300) / (480 - 300)) * 0.7
        )
    );

    document.querySelector('main').style.backgroundColor =
        `rgba(0,0,0,${opacity})`;
}

window.addEventListener('resize', updateViewport);
updateViewport();
</script>
