<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<title>Viewport Checker — Emmanuel Arizmendi</title>

<style>
:root { -webkit-transition-duration: 0.2s; -moz-transition-duration: 0.2s; transition-duration: 0.2s; }

body { font-family: Courier New, monospace; margin: 0px; padding: 0px; background: #576565; background: radial-gradient(circle,rgba(85, 102, 99, 1) 0%, rgba(71, 83, 90, 1) 100%); }

main { width: 100vw; height: 100dvh; display: flex; justify-content: center; align-items: center; color: rgba(255,255,255,0.7); font-size: 18px; letter-spacing: 1px; }

footer { position: absolute; bottom: -1px; width: 100%; padding-bottom: 30px; color: white; font-size; 14px; letter-spacing: .5px; text-align: center; text-decoration: underline; }
footer a:hover { opacity: .8; }

@media screen and (max-width: 480px) {
body { background-color: #486FFF; background: radial-gradient(circle,rgba(72, 111, 255, 1) 0%, rgba(41, 49, 210, 1) 100%); }
main { font-size: 3.5vw; }
}

</style>

</head>


<body>
	
<main id="viewport"></main>

<footer><a href="http://arizdesign.com/">arizdesign.com</a></footer>
</body>

<script>
function updateViewport() {
    const width = window.innerWidth;

    document.getElementById('viewport').innerHTML =
    '<span style="color: white;">@media screen</span>  and (max-width: <strong>' + width + '</strong><strong>px</strong>)';

    let opacity;

    if (width >= 1080) {

        // Lock at 0.8
        opacity = 0.7;

    } else if (width > 480) {

        // 1080 -> 480
        opacity = 0.1 + ((width - 480) / (1080 - 480)) * 0.7;

    } else {

        // 480 -> 0
        opacity = 0.1 + (width / 480) * 0.7;

    }

    opacity = Math.max(0.1, Math.min(0.7, opacity));

    document.querySelector('main').style.backgroundColor =
        `rgba(0,0,0,${opacity.toFixed(3)})`;
}

window.addEventListener('resize', updateViewport);

window.addEventListener('orientationchange', () => {
    setTimeout(updateViewport, 100);
});

if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', updateViewport);
}

updateViewport();
</script>

</html>
