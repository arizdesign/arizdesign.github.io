<!-- JS LOADING FROM GOOGLE -->
<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.5.1/jquery.min.js"></script>

<title>Emmanuel Arizmendi - Interactive Designer</title>

<style>

body { margin: 100px 0; }
main { width: 95% }

h1 {  }

.work-grid {  }
.work-item { display: inline-block; margin-top: 100px; }
.work-item:hover .work-title { color: dodgerblue; }

.work-info { text-align: left; font-size: 5vw !important; }
.work-title { font-weight: bold; }
.work-category {  }
	
.loading { opacity: 0.5; }
.error { color: red; }

	
@media only screen and (max-width: 480px) {

}

</style>

</head>


<body>

<main>

<section id="work-grid" class="work-grid">
    <p class="loading">Loading work...</p> 
</section>

<section id="work-grid" class="work-grid">
	<a class="work-item" href="https://www.linkedin.com/in/arizdesign?trk=public_post_follow-view-profile"><div class="work-info"><h2 class="work-title">View more on LinkedIn</h2></div></a> 
</section>

</main>


    <script>

        /*
        ==========================================
        LOAD PROJECTS
        ==========================================
        */

        async function loadProjects() {

            const grid =
                document.getElementById("work-grid");


            try {

                const response =
                    await fetch("projects.json");


                if (!response.ok) {

                    throw new Error(
                        "Could not load projects.json"
                    );

                }


                const projects =
                    await response.json();


                grid.innerHTML = "";


                projects.forEach(
                    project => {

                        createProjectCard(
                            project,
                            grid
                        );

                    }
                );


            } catch (error) {

                console.error(error);


                grid.innerHTML = `
                    <p class="error">
                        Unable to load projects.
                    </p>
                `;

            }

        }


        /*
        ==========================================
        CREATE PROJECT CARD
        ==========================================
        */

        function createProjectCard(
            project,
            grid
        ) {

            /*
            Card link
            */

            const link =
                document.createElement("a");

            link.className =
                "work-item";

            link.href =
                project.url;


             /*
            Information
            */

            const info =
                document.createElement("div");

            info.className =
                "work-info";


            /*
            Title
            */

            const title =
                document.createElement("h2");

            title.className =
                "work-title";

            title.textContent =
                project.title;


            /*
            Category
            */

            const category =
                document.createElement("h2");

            category.className =
                "work-category";

            category.textContent =
                project.category;


            /*
            Assemble card
            */

            info.appendChild(
                title
            );

            info.appendChild(
                category
            );

            link.appendChild(
                info
            );

            grid.appendChild(
                link
            );

        }


        /*
        ==========================================
        START
        ==========================================
        */

        loadProjects();

    </script>

</body>

</html>
