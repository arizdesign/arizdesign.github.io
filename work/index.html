<!DOCTYPE html>
<html>
<head>

<meta name="description" content="Hello, my name is Emmanuel Arizmendi and I like to code and design" />
	
<meta property="og:title" content="Emmanuel Arizmendi - Interactive Designer" />
<meta property="og:image" content="" />	

<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<meta name="google" content="notranslate" />
<meta http-equiv="Content-Language" content="en_US" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta content="width=device-width; initial-scale=1.0; maximum-scale=1.0; user-scalable=no;" name="viewport" />
<meta name="viewport" content="width=device-width" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />

<link rel="shortcut icon" href="../arizdesign_favicon.ico" type="image/x-icon" />
<link rel="stylesheet" type="text/css" href="../arizdesign_reset.css">

<!-- JS LOADING FROM GOOGLE -->
<script src="http://ajax.googleapis.com/ajax/libs/jquery/1.5.1/jquery.min.js"></script>

<title>Emmanuel Arizmendi - Interactive Designer</title>

<style>

body { margin: 100px 0; }
main { max-width: 1024px; padding: 0px 5%; }

h1 {  }

.work-grid {  }
.work-item { display: inline-block; vertical-align: top; width: 29%; margin: 50px 2% 0px 2%; }
.work-item .work-title:hover { color: dodgerblue; }
.work-image-wrapper { width: 100%; aspect-ratio: 4 / 3; overflow: hidden; background: whitesmoke; }
.work-image { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
.work-info { padding-top: 15px; text-align: center; }
.work-title { font-size: 16px; }
.work-category { padding-top: 5px; font-size: 13px; color: gray; }
	
.loading { opacity: 0.5; }
.error { color: #b00020; }

@media only screen and (max-width: 480px) {
.work-item { width: 40%; }
}

</style>

</head>


<body>

<main>

<h1>Work</h1>

<section id="work-grid" class="work-grid">
    <p class="loading">Loading work...</p>
</section>

</main>


    <script>

        /*
        ==========================================
        LOAD PROJECTS
        ==========================================
        */

        async function loadProjects() {

            const grid =
                document.getElementById("work-grid");


            try {

                const response =
                    await fetch("projects.json");


                if (!response.ok) {

                    throw new Error(
                        "Could not load projects.json"
                    );

                }


                const projects =
                    await response.json();


                grid.innerHTML = "";


                projects.forEach(
                    project => {

                        createProjectCard(
                            project,
                            grid
                        );

                    }
                );


            } catch (error) {

                console.error(error);


                grid.innerHTML = `
                    <p class="error">
                        Unable to load projects.
                    </p>
                `;

            }

        }


        /*
        ==========================================
        CREATE PROJECT CARD
        ==========================================
        */

        function createProjectCard(
            project,
            grid
        ) {

            /*
            Card link
            */

            const link =
                document.createElement("a");

            link.className =
                "work-item";

            link.href =
                project.url;


            /*
            Image wrapper
            */

            const imageWrapper =
                document.createElement("div");

            imageWrapper.className =
                "work-image-wrapper";


            /*
            Image
            */

            const image =
                document.createElement("img");

            image.className =
                "work-image";

            image.src =
                project.cover;

            image.loading =
                "lazy";


            imageWrapper.appendChild(
                image
            );


            /*
            Information
            */

            const info =
                document.createElement("div");

            info.className =
                "work-info";


            /*
            Title
            */

            const title =
                document.createElement("h2");

            title.className =
                "work-title";

            title.textContent =
                project.title;


            /*
            Category
            */

            const category =
                document.createElement("p");

            category.className =
                "work-category";

            category.textContent =
                project.category;


            /*
            Assemble card
            */

            info.appendChild(
                title
            );

            info.appendChild(
                category
            );

            link.appendChild(
                imageWrapper
            );

            link.appendChild(
                info
            );

            grid.appendChild(
                link
            );

        }


        /*
        ==========================================
        START
        ==========================================
        */

        loadProjects();

    </script>

</body>

</html>
