<title>Emmanuel Arizmendi - Interactive Designer</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #fff;
            color: #111;
        }

        .work-page {
            padding: 40px;
        }

        .work-header {
            margin-bottom: 50px;
        }

        .work-header h1 {
            margin: 0;
            font-size: 48px;
            font-weight: 500;
        }

        .work-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px 20px;
        }

        .work-item {
            color: inherit;
            text-decoration: none;
        }

        .work-image {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            display: block;
            background: #eee;
            transition: transform 0.4s ease;
        }

        .work-item:hover .work-image {
            transform: scale(1.03);
        }

        .work-title {
            margin: 12px 0 0;
            font-size: 18px;
            font-weight: 500;
        }

        .work-category {
            margin: 5px 0 0;
            font-size: 14px;
            opacity: .55;
        }

        @media (max-width: 800px) {

            .work-page {
                padding: 30px;
            }

            .work-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 500px) {

            .work-page {
                padding: 20px;
            }

            .work-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

<main class="work-page">

    <header class="work-header">
        <h1>Work</h1>
    </header>

    <section
        id="work-grid"
        class="work-grid">
    </section>

</main>


<script>

    /*
    ==========================================
    PROJECT LIST

    Add new projects here.
    ==========================================
    */

    const projects = [

        "happy-valley-or_branding"

    ];


    /*
    ==========================================
    CREATE PROJECT GRID
    ==========================================
    */

    const grid =
        document.getElementById("work-grid");


    projects.forEach(project => {


        /*
        Split folder name

        happy-valley-or_branding

        becomes:

        happy-valley-or
        branding
        */

        const parts =
            project.split("_");


        const projectName =
            parts[0];


        const category =
            parts.slice(1).join(" ");


        /*
        Convert project name
        into readable text.
        */

        const title =
            formatTitle(projectName);


        const categoryTitle =
            formatTitle(category);


        /*
        Create link
        */

        const link =
            document.createElement("a");


        link.className =
            "work-item";


        link.href =
            `/work/${project}/`;


        /*
        Create image
        */

        const image =
            document.createElement("img");


        image.className =
            "work-image";


        image.src =
            `/work/${project}/cover.jpg`;


        image.alt =
            title;


        image.loading =
            "lazy";


        /*
        Create title
        */

        const titleElement =
            document.createElement("h2");


        titleElement.className =
            "work-title";


        titleElement.textContent =
            title;


        /*
        Create category
        */

        const categoryElement =
            document.createElement("p");


        categoryElement.className =
            "work-category";


        categoryElement.textContent =
            categoryTitle;


        /*
        Add everything to card
        */

        link.appendChild(image);

        link.appendChild(titleElement);

        link.appendChild(categoryElement);


        /*
        Add card to grid
        */

        grid.appendChild(link);

    });


    /*
    ==========================================
    FORMAT TITLES
    ==========================================
    */

    function formatTitle(text) {

        return text

            .replace(/-/g, " ")

            .replace(/\b\w/g, letter =>
                letter.toUpperCase()
            );

    }

</script>
